[package]
name = "amux"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
memchr = "2.8.3"
regex-lite = "0.1.9"
rustix = { version = "1.1.6", features = ["pty", "termios", "event", "net", "fs", "process", "stdio", "pipe", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
vte = "0.15.0"

[lib]
name = "amux"
path = "src/lib.rs"

[[bin]]
name = "amux"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"
